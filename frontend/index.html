<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERA BOM Tree Table</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="glow-bg"></div>
  <header class="app-header">
    <div class="header-container">
      <div class="logo">
        <span class="logo-icon">▲</span>
        <h1>ERA BOM Explorer</h1>
        <span class="badge">BOM Tree v1.0</span>
      </div>
      <div class="api-status">
        <span class="status-indicator" id="status-indicator"></span>
        <span id="status-text">Connecting to Baserow...</span>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="content-area">
      <div class="content-header">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search by name, description or helper (e.g. '20 3')...">
          <span class="search-icon">🔍</span>
        </div>
        <button id="btn-refresh" class="btn btn-secondary">Refresh Tree</button>
      </div>

      <div class="card table-card">
        <div class="tree-table-header">
          <div class="col-desc">Part Description (Hierarchy)</div>
          <div class="col-pn">Part Number</div>
          <div class="col-qty">Quantity</div>
        </div>
        <div id="tree-container" class="tree-container">
          <div class="loading-spinner">Loading BOM data from Baserow...</div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
