<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERA BaseRow Manager - Boilerplate</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="glow-bg"></div>
  <header class="app-header">
    <div class="header-container">
      <div class="logo">
        <span class="logo-icon">▲</span>
        <h1>ERA BaseRow Manager</h1>
        <span class="badge">Boilerplate v1.0</span>
      </div>
      <div class="api-status">
        <span class="status-indicator" id="status-indicator"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="sidebar">
      <section class="card form-card">
        <h2>Create New Part</h2>
        <form id="part-form">
          <div class="form-group">
            <label for="part-name">Part Name</label>
            <input type="text" id="part-name" placeholder="e.g. Engine Block" required>
          </div>
          <div class="form-group">
            <label for="part-description">Description</label>
            <textarea id="part-description" placeholder="e.g. V8 engine casing" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label for="part-parent">Parent Part (Optional)</label>
            <select id="part-parent">
              <option value="">None (Root Part)</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Create Part</button>
        </form>
      </section>

      <section class="card stats-card">
        <h2>Statistics</h2>
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">Total Parts</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="stat-roots">0</span>
            <span class="stat-label">Root Parts</span>
          </div>
        </div>
      </section>
    </div>

    <div class="content-area">
      <div class="content-header">
        <h2>Parts Hierarchy</h2>
        <button id="btn-refresh" class="btn btn-secondary">Refresh Tree</button>
      </div>
      <div class="card tree-card">
        <div id="tree-container" class="tree-container">
          <!-- Dynamically populated -->
          <div class="loading-spinner">Loading hierarchy...</div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <!-- Modal for editing parts -->
  <div id="edit-modal" class="modal">
    <div class="modal-content card">
      <h2>Edit Part</h2>
      <form id="edit-form">
        <input type="hidden" id="edit-part-id">
        <div class="form-group">
          <label for="edit-part-name">Part Name</label>
          <input type="text" id="edit-part-name" required>
        </div>
        <div class="form-group">
          <label for="edit-part-description">Description</label>
          <textarea id="edit-part-description" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="edit-part-parent">Parent Part</label>
          <select id="edit-part-parent">
            <option value="">None (Root Part)</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
