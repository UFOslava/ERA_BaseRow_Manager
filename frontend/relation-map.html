<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERA BOM Relation Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/src/style.css">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0a0a1a;
    }
    .app-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
    }
    #map-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    #map-canvas:active {
      cursor: grabbing;
    }
    .hud-controls {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 10;
    }
    .hud-tool-controls {
      position: absolute;
      bottom: 9.5rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 10;
    }
    .hud-btn {
      width: 40px;
      height: 40px;
      background: rgba(12, 12, 15, 0.85);
      border: 1px solid var(--color-gold);
      color: var(--color-gold-bright);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: var(--transition-smooth);
    }
    .hud-btn:hover {
      background: rgba(197, 160, 89, 0.15);
      box-shadow: 0 0 10px var(--color-gold-glow);
    }
    .hud-btn.active {
      background: rgba(197, 160, 89, 0.3);
      border-color: var(--color-gold-bright);
      color: #ffffff;
      box-shadow: 0 0 14px var(--color-gold-glow);
    }
    .info-panel {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      background: rgba(12, 12, 15, 0.85);
      border: 1px solid var(--card-border);
      padding: 1rem 1.5rem;
      backdrop-filter: blur(10px);
      z-index: 10;
      color: var(--text-secondary);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .info-panel span {
      color: var(--color-gold-bright);
      font-weight: 600;
    }
    .map-tooltip {
      position: absolute;
      pointer-events: none;
      background: var(--card-bg);
      border: 1px solid var(--color-gold);
      padding: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 100;
      display: none;
      flex-direction: column;
      gap: 0.5rem;
      backdrop-filter: blur(10px);
      min-width: 200px;
    }
    .map-tooltip .tt-pn {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--color-gold-bright);
    }
    .map-tooltip .tt-desc {
      font-size: 0.9rem;
      color: var(--text-primary);
    }
    .map-tooltip .tt-state {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 26, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      color: var(--color-gold);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      backdrop-filter: blur(5px);
    }
    .map-toast {
      position: absolute;
      top: 5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 12, 15, 0.92);
      border: 1px solid var(--color-gold);
      color: var(--color-gold-bright);
      padding: 0.75rem 1.5rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      z-index: 200;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 0.5rem;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .btn-mode-toggle {
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-mode-toggle.active {
      background: var(--color-gold) !important;
      color: #000 !important;
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.4);
    }
    .btn-mode-toggle:not(.active):hover {
      background: rgba(197, 160, 89, 0.15) !important;
      color: var(--color-gold-bright) !important;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <div class="logo">
        <span class="logo-icon">▲</span>
        <h1>Relation Map (Sandbox)</h1>
      </div>
      <div class="api-status">
        <button id="btn-filter" class="btn btn-secondary btn-sm btn-filter" style="margin-right: 0.75rem; padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: 0; position: relative;" title="Filter Diagram">
          <i class="fa-solid fa-filter"></i> Filter
          <span id="filter-badge" class="filter-badge" style="display: none;">0</span>
        </button>
        <button id="btn-refresh-map" class="btn btn-secondary btn-sm" style="margin-right: 0.75rem; padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: 0;">
          <i class="fa-solid fa-arrows-rotate"></i> Refresh Map
        </button>
        <a href="/index.html" class="btn btn-secondary btn-sm" style="margin-right: 1rem; padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: 0;">
          <i class="fa-solid fa-arrow-left"></i> Back to BOM Tree
        </a>
        <span class="status-indicator" id="status-indicator"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
  </header>

  <!-- Sandbox Toolbar -->
  <div class="sandbox-toolbar" style="position: absolute; top: 5rem; left: 1rem; background: rgba(12, 12, 15, 0.85); border: 1px solid var(--card-border); padding: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 10; backdrop-filter: blur(10px);">
    <div class="tool-group" style="display: flex; flex-direction: column; gap: 0.25rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem; margin-bottom: 0.25rem;">
      <button class="hud-btn active" id="tool-pan" title="Pan Tool (P)"><i class="fa-solid fa-hand"></i></button>
      <button class="hud-btn" id="tool-drag" title="Drag Node Tool (D)"><i class="fa-solid fa-arrows-up-down-left-right"></i></button>
      <button class="hud-btn" id="tool-join" title="Join Tool (J)"><i class="fa-solid fa-link"></i></button>
      <button class="hud-btn" id="tool-sever" title="Sever Tool (S)"><i class="fa-solid fa-unlink"></i></button>
      <button class="hud-btn" id="tool-hide-node" title="Hide Node (H)"><i class="fa-solid fa-eye-slash"></i></button>
      <button class="hud-btn" id="tool-hide-branch" title="Hide Branch (B)"><i class="fa-solid fa-sitemap"></i></button>
    </div>
    <div class="zoom-group" style="display: flex; align-items: center; gap: 0.5rem;">
      <button class="hud-btn" id="btn-zoom-out" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
      <input type="range" id="zoom-slider" min="0.1" max="3" step="0.1" value="1" style="width: 80px;" title="Zoom Level">
      <button class="hud-btn" id="btn-zoom-in" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
      <button class="hud-btn" id="btn-reset-view" title="Reset View"><i class="fa-solid fa-expand"></i></button>
    </div>
  </div>

  <!-- Filter Drawer -->
  <div id="filter-drawer" class="drawer">
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="drawer-content" style="max-width: 700px;">
      <div class="drawer-header">
        <h2>Filter Relation Map</h2>
        <button id="btn-close-drawer" class="btn-close">&times;</button>
      </div>
      <div class="drawer-body">
        <div class="filter-columns" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
          <div class="filter-column">
            <h3 style="font-size: 1.1rem; color: var(--color-gold-bright); margin-bottom: 1rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem;"><i class="fa-solid fa-tags" style="margin-right: 0.5rem; font-size: 0.9rem;"></i> PN Categories</h3>
            <div id="categories-filter-list" class="categories-filter-list" style="display: flex; flex-direction: column; gap: 0.75rem;">
              <!-- Category checkboxes will be dynamically inserted here -->
            </div>
          </div>
          <div class="filter-column">
            <h3 style="font-size: 1.1rem; color: var(--color-gold-bright); margin-bottom: 1rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem;"><i class="fa-solid fa-list-check" style="margin-right: 0.5rem; font-size: 0.9rem;"></i> Item States</h3>
            <div id="states-filter-list" class="states-filter-list" style="display: flex; flex-direction: column; gap: 0.75rem;">
              <!-- State checkboxes will be dynamically inserted here -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="loading-overlay" id="loading-overlay">
    Initializing Map...
  </div>

  <div class="map-toast" id="map-toast"></div>

  <canvas id="map-canvas"></canvas>

  <div class="info-panel">
    <div>Total Nodes: <span id="info-total-nodes">0</span></div>
    <div>Expanded Nexus: <span id="info-expanded">0</span> / <span id="info-nexus">0</span></div>
  </div>

  <div class="map-tooltip" id="map-tooltip">
    <div class="tt-pn" id="tt-pn"></div>
    <div class="tt-desc" id="tt-desc"></div>
    <div class="tt-state" id="tt-state"></div>
  </div>

  <script type="module" src="/src/relation-map.js"></script>
</body>
</html>
