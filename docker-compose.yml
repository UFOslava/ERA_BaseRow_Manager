version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
      - "${MCP_PORT:-8001}:8001"
    volumes:
      - backend-data:/app/data
      - backend-backups:/app/backups
    environment:
      - BASEROW_API_URL=${BASEROW_API_URL:-http://localhost:7070}
      - BASEROW_TOKEN=${BASEROW_TOKEN:?set BASEROW_TOKEN in .env}
      - BASEROW_ADMIN_EMAIL=${BASEROW_ADMIN_EMAIL:-UFOslava@hotmail.com}
      - BASEROW_ADMIN_PASSWORD=${BASEROW_ADMIN_PASSWORD:?set BASEROW_ADMIN_PASSWORD in .env}
      - BASEROW_TABLE_BOM=${BASEROW_TABLE_BOM:-508}
      - BASEROW_TABLE_ASSEMBLY=${BASEROW_TABLE_ASSEMBLY:-701}
      - BASEROW_TABLE_INSTRUCTIONS=${BASEROW_TABLE_INSTRUCTIONS:-5770}
      - BASEROW_TABLE_PN_CATEGORIES=${BASEROW_TABLE_PN_CATEGORIES:-42471}
      - BASEROW_TABLE_ITEM_STATES=${BASEROW_TABLE_ITEM_STATES:-48537}
      - BASEROW_TABLE_WI_TEMPLATES=${BASEROW_TABLE_WI_TEMPLATES:-48538}
      - BASEROW_TABLE_MANUFACTURERS=${BASEROW_TABLE_MANUFACTURERS:-683}
      - BASEROW_TABLE_SUPPLIERS=${BASEROW_TABLE_SUPPLIERS:-682}
      - BASEROW_TABLE_CONTACTS=${BASEROW_TABLE_CONTACTS:-684}
      - DATABASE_URL=${DATABASE_URL:-/app/data/parts.db}
      - FLASK_ENV=${FLASK_ENV:-production}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - MCP_PORT=${MCP_PORT:-8001}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    depends_on:
      - backend
    restart: unless-stopped

  oauth:
    build: ./backend
    # On production (era-server), this uses image: era-backend:${ERA_IMAGE_TAG}
    command: python run.py --oauth-server --oauth-host 0.0.0.0 --oauth-port 10000
    ports:
      - "10000:10000"
    volumes:
      - oauth-keys:/app/keys
      # On production (era-server), use a host mount: - /opt/stacks/era/oauth-state:/app/data
      - oauth-state:/app/data
    environment:
      - OAUTH_ISSUER_URL=${OAUTH_ISSUER_URL:-http://localhost:10000}
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:-http://localhost:8001}
      - OAUTH_KEY_PATH=/app/keys/oauth_key.pem
    restart: unless-stopped

volumes:
  backend-data:
  backend-backups:
  oauth-keys:
  oauth-state:
